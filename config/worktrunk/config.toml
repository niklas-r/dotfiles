# A string is a single command:
# pre-start = "npm install"
#
# A table is multiple command that run concurrently:
# ```
# [post-start]
# server = "npm run dev"
# watch = "npm run watch"
# ```
#
# A pipeline is a sequence of `[[hook]]` blocks run in order. Each block is one step; multiple keys within a block run concurrently. A failing step aborts the rest of the pipeline:
# ```
# [[post-start]]
# install = "npm ci"
#
# [[post-start]]
# build = "npm run build"
# server = "npm run dev"
# ```

# pre-start: Runs once when a new worktree is created, blocking `post-start`/`--execute` until complete: recommended for dependency install, env file generation
# post-start: Runs once when a new worktree is created, in the background: recommended for dev servers, long builds, file watchers, copying caches

[[pre-start]]
copy = "wt step copy-ignored"

[commit.generation]
command = "MAX_THINKING_TOKENS=0 claude -p --no-session-persistence --model=haiku --tools='' --safe-mode --setting-sources='user' --system-prompt=''"

[list]
summary = true
