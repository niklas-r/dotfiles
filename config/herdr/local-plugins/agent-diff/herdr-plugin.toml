id = "niklas.agent-diff"
name = "Agent Diff"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Pick a diff scope for the focused agent pane and open it with CodeDiff in nvim"
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Diff agent changes in nvim"
contexts = ["pane"]
command = ["python3", "bin/pick"]

# Opened by the `pick` action with AGENT_DIFF_PANE set to the agent pane.
[[panes]]
id = "menu"
title = "agent diff"
placement = "popup"
width = 40
height = 8
command = ["python3", "bin/menu"]

# Snapshots the working tree when an agent starts; scope 1 diffs against it.
[[events]]
on = "pane.agent_detected"
command = ["python3", "bin/snapshot"]
