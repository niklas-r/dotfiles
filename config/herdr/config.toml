onboarding = false

[theme]
name = "rose-pine"
auto_switch = false

[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
# $name comes from the niklas.agent-names plugin (local-plugins/agent-names).
rows = [
  ["state_icon", "machine", { token = "$name", bold = true }, "workspace"],
  ["pane"]
]

[keys]
prefix = "ctrl+s"
split_horizontal = "prefix+s"
split_vertical = "prefix+v"
settings = "prefix+shift+s"
navigate_workspace_down = "j"
navigate_workspace_up = "k"


[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

###################
# Annotate plugin #
###################
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+d"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"
